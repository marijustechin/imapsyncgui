name: macOS arm64 (native) verification

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  arm64:
    runs-on: macos-15
    steps:
      - name: Verify native arm64 host
        run: |
          echo "uname -m: $(uname -m)"
          if [ "$(uname -m)" != "arm64" ]; then
            echo "ERROR: runner is not arm64; aborting."
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Enable Corepack
        run: corepack enable

      - name: Record environment
        run: |
          echo "macOS: $(sw_vers -productVersion)"
          echo "uname -m: $(uname -m)"
          echo "node: $(node --version)"
          echo "process.arch: $(node -p 'process.arch')"
          echo "pnpm: $(pnpm --version)"
          if [ "$(node -p 'process.arch')" != "arm64" ]; then
            echo "ERROR: Node.js is not running as arm64; aborting."
            exit 1
          fi

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Baseline verification
        run: pnpm verify

      - name: Build arm64 runtime
        run: pnpm --filter @imapsyncgui/desktop run runtime:build:arm64

      - name: Validate arm64 runtime
        run: pnpm --filter @imapsyncgui/desktop run runtime:validate

      - name: Self-test arm64 runtime (host isolation)
        run: pnpm --filter @imapsyncgui/desktop run runtime:self-test

      - name: Build arm64 application
        run: pnpm --filter @imapsyncgui/desktop run package:mac:arm64

      - name: Inspect architectures
        working-directory: apps/desktop
        run: |
          APP=$(find release -maxdepth 2 -name 'imapSyncGUI.app' -type d | head -1)
          echo "app: $APP"
          file "$APP/Contents/MacOS/imapSyncGUI"
          file "$APP/Contents/Resources/runtime/darwin-arm64/bin/imapsync"
          echo "--- dynamic libraries ---"
          otool -L "$APP/Contents/Resources/runtime/darwin-arm64/bin/imapsync"
          echo "--- manifest ---"
          cat "$APP/Contents/Resources/runtime/darwin-arm64/manifest.json"

      - name: Verify ad-hoc signature
        working-directory: apps/desktop
        run: |
          APP=$(find release -maxdepth 2 -name 'imapSyncGUI.app' -type d | head -1)
          codesign -dv --verbose=2 "$APP"
          codesign --verify --deep --strict --verbose=2 "$APP"

      - name: Packaged runtime smoke test
        run: pnpm --filter @imapsyncgui/desktop run package:smoke

      - name: Launch application (best effort)
        continue-on-error: true
        working-directory: apps/desktop
        run: |
          APP=$(find release -maxdepth 2 -name 'imapSyncGUI.app' -type d | head -1)
          "$APP/Contents/MacOS/imapSyncGUI" >/tmp/app-launch.log 2>&1 &
          APP_PID=$!
          sleep 8
          if kill -0 "$APP_PID" 2>/dev/null; then
            echo "application process started (pid $APP_PID)"
            kill "$APP_PID" || true
          else
            echo "application process did not stay running; log follows"
            cat /tmp/app-launch.log
          fi

      - name: Verify DMG (hdiutil verify)
        working-directory: apps/desktop
        run: |
          DMG=$(ls release/*-mac-arm64.dmg)
          echo "dmg: $DMG"
          hdiutil verify "$DMG"

      - name: Mount DMG and inspect mounted volume
        working-directory: apps/desktop
        run: |
          DMG=$(ls release/*-mac-arm64.dmg)
          MOUNT_OUTPUT=$(hdiutil attach -nobrowse -readonly "$DMG")
          echo "$MOUNT_OUTPUT"
          VOLUME=$(echo "$MOUNT_OUTPUT" | awk -F'\t' '/Apple_HFS/ {print $3}' | tail -1)
          echo "volume: $VOLUME"
          echo "VOLUME=$VOLUME" >> "$GITHUB_ENV"
          ls -la "$VOLUME"
          test -d "$VOLUME/imapSyncGUI.app"
          test -L "$VOLUME/Applications"
          file "$VOLUME/imapSyncGUI.app/Contents/MacOS/imapSyncGUI"
          file "$VOLUME/imapSyncGUI.app/Contents/Resources/runtime/darwin-arm64/bin/imapsync"

      - name: Smoke test app copied from DMG
        working-directory: apps/desktop
        run: |
          COPY_DIR=$(mktemp -d)
          ditto "$VOLUME/imapSyncGUI.app" "$COPY_DIR/imapSyncGUI.app"
          echo "copied app to $COPY_DIR"
          file "$COPY_DIR/imapSyncGUI.app/Contents/MacOS/imapSyncGUI"
          codesign --verify --deep --strict --verbose=2 "$COPY_DIR/imapSyncGUI.app"
          pnpm --filter @imapsyncgui/desktop run package:smoke --arch arm64 --app "$COPY_DIR/imapSyncGUI.app"

      - name: Detach DMG
        if: always()
        run: |
          if [ -n "$VOLUME" ] && [ -d "$VOLUME" ]; then
            hdiutil detach "$VOLUME" || true
          fi

      - name: Compute artifact checksums
        working-directory: apps/desktop
        run: |
          cd release
          shasum -a 256 *-mac-arm64.dmg *-mac-arm64.zip | tee SHA256SUMS-arm64.txt

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: imapSyncGUI-mac-arm64
          path: |
            apps/desktop/release/*-mac-arm64.dmg
            apps/desktop/release/*-mac-arm64.zip
            apps/desktop/release/SHA256SUMS-arm64.txt
            apps/desktop/release/**/imapSyncGUI.app/Contents/Resources/runtime/darwin-arm64/manifest.json
          if-no-files-found: error
